name: Preview quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r skills/skill-architect/requirements-dev.txt
      - run: python -m unittest discover -s skills/skill-architect/tests -v
      - run: python skills/skill-architect/scripts/validate.py skills/skill-architect --profile engineered --json
      - run: python skills/skill-architect/scripts/validate.py skills/application-defence --profile engineered --json
      - run: python skills/skill-architect/scripts/build_preview.py --skill skills/skill-architect --skill skills/application-defence --output dist/ci
